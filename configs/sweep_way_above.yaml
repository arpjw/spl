# Comfortably-above-threshold sweep run: budget ~7.8x n^k.
#
# Purpose: show the drop point shifting earlier (in samples) as the budget
# grows, i.e. more headroom above the SQ floor. Otherwise identical to
# sweep_above.

run_name: sweep_way_above

n: 40
k: 3
S_seed: 0
expected_S: [20, 24, 32]

sample_budget: 500000

hidden: 64

optimizer: sgd
lr: 0.1
momentum: 0.0

batch_size: 32

eval_every_steps: 25
eval_batch_size: 10000

model_seed: 30
train_data_seed: 31
eval_data_seed: 32

device: cpu
