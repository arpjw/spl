# Aside, not part of the sweep proper. Kept because it is an interesting
# finding on its own: multi-pass SGD samples with replacement from a fixed
# pool of 25,600 rows (~0.4x the n^k = 64,000 reference) and learns the parity,
# reaching essentially zero eval loss on fresh online samples. This is not a
# contradiction of the SQ computational lower bound or evidence of a hard
# sample floor. It also uses far more training steps than the short online run.

run_name: aside_fixed_pool

n: 40
k: 3
S_seed: 0
expected_S: [20, 24, 32]

fixed_pool_size: 25600
sample_budget: 2000000

hidden: 64

optimizer: sgd
lr: 0.1
momentum: 0.0

batch_size: 32

eval_every_steps: 250
eval_batch_size: 10000

model_seed: 0
train_data_seed: 1
eval_data_seed: 2

device: cpu
