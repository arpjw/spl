# Short sweep run: a negative outcome for this seed and budget.
#
# Strict online sampling. Fresh batch every step, no fixed dataset, no
# repeated access. Sample budget: 16,000 (~0.25x the n^k = 64,000 reference).
# This one run does not establish a universal sample floor.
#
# The shorter training budget also means fewer gradient steps.

run_name: sweep_below

n: 40
k: 3
S_seed: 0
expected_S: [20, 24, 32]

sample_budget: 16000

hidden: 64

optimizer: sgd
lr: 0.1
momentum: 0.0

batch_size: 32

eval_every_steps: 25
eval_batch_size: 10000

model_seed: 10
train_data_seed: 11
eval_data_seed: 12

device: cpu
