# Below-threshold sweep run: the legitimate negative result.
#
# Strict online sampling. Fresh batch every step, no fixed dataset, no
# repeated epochs. Sample budget: 16,000 (~0.25x the n^k = 64,000 threshold).
# This directly demonstrates the single-pass SQ floor: given fewer than n^k
# independent samples total, ever, single-pass SGD does not learn the parity.
#
# Runtime is short by design. The point is that the model has literally
# never seen enough independent data for the SQ bound to be satisfied, not
# that we ran out of gradient steps.

run_name: sweep_below

n: 40
k: 3
S_seed: 0
expected_S: [20, 24, 32]

sample_budget: 16000

hidden: 64

optimizer: sgd
lr: 0.1
momentum: 0.0

batch_size: 32

eval_every_steps: 25
eval_batch_size: 10000

model_seed: 10
train_data_seed: 11
eval_data_seed: 12

device: cpu
