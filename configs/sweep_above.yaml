# Above-threshold sweep run: budget ~3.9x n^k.
#
# Mirrors the already-validated sanity config. Rerun under the sweep_above
# name so all sweep outputs live together under results/sweep_*/log.csv.

run_name: sweep_above

n: 40
k: 3
S_seed: 0
expected_S: [20, 24, 32]

sample_budget: 250000

hidden: 64

optimizer: sgd
lr: 0.1
momentum: 0.0

batch_size: 32

eval_every_steps: 25
eval_batch_size: 10000

model_seed: 0
train_data_seed: 1
eval_data_seed: 2

device: cpu
